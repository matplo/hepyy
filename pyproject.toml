[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hepyy"
version = "0.2.7"
description = "HEP C++ package manager with cppyy dynamic bindings"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [
    { name = "Mateusz Płoskoń", email = "ploskon@gmail.com" },
]
keywords = ["hep", "physics", "cppyy", "fastjet", "pythia8", "lhapdf", "hepmc3"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: C++",
]
dependencies = [
    "cppyy>=3.1",
    "click>=8.1",
    "requests>=2.31,<=2.32.4",
    "tqdm>=4.66",
    "pyyaml>=6.0",
    "jinja2>=3.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://github.com/matplo/hepyy"
Repository = "https://github.com/matplo/hepyy"
Issues = "https://github.com/matplo/hepyy/issues"

[project.scripts]
hepyy = "hepyy.cli:main"
heyy = "hepyy.cli:main"
her = "hepyy.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hepyy"]

# Ship hepyy_autoload.pth at the wheel root (next to *.dist-info/, not inside
# the hepyy/ package dir) so pip installs it straight into site-packages on
# every `pip install hepyy` and removes it automatically on `pip uninstall`
# via its own RECORD tracking — no custom install/uninstall code needed.
# It's a no-op unless HEPYY_LOADED_* env vars are set (see hepyy/_autoload.py).
[tool.hatch.build.targets.wheel.force-include]
"src/hepyy_autoload.pth" = "hepyy_autoload.pth"
